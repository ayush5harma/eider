name: Pages

# Builds the static site in site/ and publishes it with GitHub Pages
# (Settings > Pages > Source: GitHub Actions). The build reads docs/images and
# the cask version, so those paths trigger it too.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/images/**"
      - "Casks/eider.rb"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let a running one finish rather than cancel it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v6

      - name: Build the site
        run: python3 site/build.py

      - name: Check links and anchors
        run: python3 site/check_links.py site/dist

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
